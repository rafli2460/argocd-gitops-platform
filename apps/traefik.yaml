apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.4.0
    helm:
      valuesObject:
        service:
          spec:
            type: NodePort
        # NodePort has no LB address to copy; publish a fixed one so ArgoCD marks Ingresses Healthy
        providers:
          kubernetesIngress:
            publishedService:
              enabled: false
            ingressEndpoint:
              hostname: localhost
        ports:
          web:
            nodePort: 30080
          websecure:
            nodePort: 30443
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
