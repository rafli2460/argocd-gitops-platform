kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gitops-portfolio
nodes:
  - role: control-plane
    # kind has no LoadBalancer: map host ports to Traefik NodePorts (30080/30443)
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
